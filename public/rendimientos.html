<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    RENDIMIENTOS Y DENSIDAD BASICA
  </title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0b0d11;
      color:#f4f4f4;
      font-family:Segoe UI, Arial, sans-serif;
    }

    .contenedor{
      width:min(1800px,98%);
      margin:20px auto;
    }

    .titulo{
      text-align:center;
      font-size:28px;
      font-weight:800;
      color:#d7ff5f;
      margin-bottom:5px;
    }

    .actualizado{
      text-align:center;
      color:#aeb5bf;
      margin-bottom:22px;
    }

    .filtros{
      background:#15181e;
      border:1px solid #2c313b;
      border-radius:10px;
      padding:18px;
      margin-bottom:18px;
    }

    .fila-controles{
      display:grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);
      gap:20px;
      width:100%;
      margin-bottom:14px;
    }

    .fila-controles:last-child{
      margin-bottom:0;
    }

    .tipo-label{
      grid-column:1 / -1;
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:#aeb5bf;
    }

    .filtro{
      width:100%;
      min-width:0;
    }

    .filtro label{
      display:block;
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:#aeb5bf;
      margin-bottom:8px;
    }

    select,
    .tipo-btn,
    .necesidad-btn{
      width:100%;
      height:39px;
      border-radius:6px;
      border:1px solid #353b46;
      font-size:13px;
      font-weight:700;
    }

    select{
      background:#0f1115;
      color:#fff;
      padding:0 12px;
    }

    .tipo-btn{
      background:#101319;
      color:#d7ff5f;
      cursor:pointer;
    }

    .tipo-btn.activo{
      background:#d7ff5f;
      color:#0b0d11;
      border-color:#d7ff5f;
    }

    .necesidad-btn{
      cursor:pointer;
    }

    .necesidad-btn.con-registros{
      background:#ff4d4f;
      color:#fff;
      border-color:#ff4d4f;
    }

    .necesidad-btn.sin-registros{
      background:#d7ff5f;
      color:#0b0d11;
      border-color:#d7ff5f;
    }

    .tabla-contenedor{
      overflow:auto;
      border:1px solid #2c313b;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#111419;
      min-width:1050px;
    }

    th,
    td{
      padding:10px 9px;
      border-bottom:1px solid #292e36;
      text-align:center;
      white-space:nowrap;
    }

    th{
      position:sticky;
      top:0;
      background:#1a1e25;
      color:#d7ff5f;
      font-size:12px;
      z-index:2;
    }

    th.sortable{
      cursor:pointer;
    }

    th.sortable::after{
      content:" ↕";
      color:#6f7680;
    }

    th.sortable.asc::after{
      content:" ▲";
      color:#d7ff5f;
    }

    th.sortable.desc::after{
      content:" ▼";
      color:#d7ff5f;
    }

    td{
      font-size:12px;
    }

    .nombre-fas-click{
      cursor:pointer;
      font-weight:700;
    }

    .nombre-fas-click:hover{
      color:#d7ff5f;
      text-decoration:underline;
    }

    .activo-si{
      color:#d7ff5f;
      font-weight:700;
    }

    .activo-no{
      color:#ff7171;
      font-weight:700;
    }

    .sin-dato{
      color:#7d848d;
    }

    .mensaje{
      padding:28px;
      text-align:center;
      color:#aeb5bf;
    }

    .error{
      color:#ff7171;
    }


    /* ============================================================
       BARCOS
       ============================================================ */

    


    /* ============================================================
       MODAL
       ============================================================ */

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }

    .modal-overlay.visible{
      display:flex;
    }

    .modal-contenido{
      width:min(760px,96vw);
      max-height:85vh;
      background:#171a21;
      border:1px solid #343a46;
      border-radius:12px;
      overflow:hidden;
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 18px;
      border-bottom:1px solid #292e38;
      background:#20242c;
    }

    .modal-titulo{
      margin:0;
      font-size:18px;
      color:#d7ff5f;
    }

    .modal-cerrar{
      border:0;
      background:transparent;
      color:#fff;
      font-size:26px;
      cursor:pointer;
    }

    .modal-body{
      padding:16px;
      overflow:auto;
      max-height:calc(85vh - 65px);
    }

    .modal-tabla{
      width:100%;
      min-width:0;
    }

    .modal-vacio{
      padding:28px 10px;
      text-align:center;
      color:#a7adb7;
    }


    @media(max-width:800px){

      .fila-controles{
        gap:10px;
      }

      .titulo{
        font-size:22px;
      }

    }

    /* ============================================================
       MODO BARCOS
       SOLO:
       NOMBRE FAS
       ESPECIE
       AÑO
       CANT. DENS. BASICA
       PROM. DENS. BASICA
       ULTIMA DENS. BASICA
       ============================================================ */

    body.modo-barcos th:nth-child(4),
    body.modo-barcos td:nth-child(4),
    body.modo-barcos th:nth-child(5),
    body.modo-barcos td:nth-child(5),
    body.modo-barcos th:nth-child(6),
    body.modo-barcos td:nth-child(6),
    body.modo-barcos th:nth-child(7),
    body.modo-barcos td:nth-child(7),
    body.modo-barcos th:nth-child(9),
    body.modo-barcos td:nth-child(9),
    body.modo-barcos th:nth-child(10),
    body.modo-barcos td:nth-child(10),
    body.modo-barcos th:nth-child(12),
    body.modo-barcos td:nth-child(12),
    body.modo-barcos th:nth-child(14),
    body.modo-barcos td:nth-child(14),
    body.modo-barcos th:nth-child(15),
    body.modo-barcos td:nth-child(15){
      display:none;
    }


    /* ============================================================
       AJUSTE COMPACTO DE COLUMNAS
       ============================================================ */

    .tabla-contenedor table{
      width:max-content;
      min-width:100%;
      table-layout:auto;
    }

    .tabla-contenedor th,
    .tabla-contenedor td{
      width:1%;
      white-space:nowrap;
      padding-left:8px;
      padding-right:8px;
    }

    .tabla-contenedor th:first-child,
    .tabla-contenedor td:first-child{
      width:auto;
    }

    .tabla-contenedor th:nth-child(2),
    .tabla-contenedor td:nth-child(2){

    }

    .tabla-contenedor th:nth-child(3),
    .tabla-contenedor td:nth-child(3){
      width:1%;
    }

    .tabla-contenedor th{
      font-size:10px;
    }

    .tabla-contenedor td{
      font-size:10px;
    }

  </style>

<script>


const URL_JSON =
  "/api/rendimientos";


let registrosOriginales = [];

let tipoSeleccionado = "";

let campoOrden =
  "nombre_fas";

let direccionOrden =
  "asc";



function normalizar(valor){

  if(
    valor === null ||
    valor === undefined
  ){
    return "";
  }

  return String(valor)
    .trim()
    .toUpperCase();
}



function formatearFecha(valor){

  if(!valor){
    return "-";
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return valor;
  }

  return fecha.toLocaleDateString(
    "es-UY",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}



function formatearFechaHora(valor){

  if(!valor){
    return "-";
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return valor;
  }

  return fecha.toLocaleString(
    "es-UY",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );
}



function valorSeguro(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  return String(valor);
}



function contadorSeguro(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero) ||
    numero === 0
  ){
    return '<span class="sin-dato">-</span>';
  }

  return numero.toLocaleString(
    "es-UY"
  );
}



function numeroDecimal(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero)
  ){
    return valorSeguro(valor);
  }

  return numero.toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:3,
      maximumFractionDigits:3
    }
  );
}



function porcentajePPS(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero)
  ){
    return valorSeguro(valor);
  }

  return (
    numero * 100
  ).toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:1,
      maximumFractionDigits:1
    }
  ) + "%";
}



function porcentajeCobertura(cantidad, total){

  const cantidadNumero =
    Number(cantidad);

  const totalNumero =
    Number(total);


  if(
    !Number.isFinite(cantidadNumero) ||
    !Number.isFinite(totalNumero) ||
    totalNumero <= 0
  ){
    return '<span class="sin-dato">-</span>';
  }


  const porcentaje =
    (
      cantidadNumero /
      totalNumero
    ) *
    100;


  return porcentaje.toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:1,
      maximumFractionDigits:1
    }
  ) + "%";
}



function calcularPorcentajeCobertura(cantidad, total){

  const cantidadNumero =
    Number(cantidad);

  const totalNumero =
    Number(total);


  if(
    !Number.isFinite(cantidadNumero) ||
    !Number.isFinite(totalNumero) ||
    totalNumero <= 0
  ){
    return null;
  }


  return (
    cantidadNumero /
    totalNumero
  ) *
  100;
}



function diasDesdeFecha(valor){

  if(!valor){
    return null;
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return null;
  }

  return (
    Date.now() -
    fecha.getTime()
  ) /
  (
    1000 *
    60 *
    60 *
    24
  );
}



function cargarFiltroNombreFas(){

  const select =
    document.getElementById(
      "filtroNombreFas"
    );

  const activoSeleccionado =
    normalizar(
      document.getElementById(
        "filtroActivo"
      ).value
    );

  const valorAnterior =
    select.value;


  const registrosLista =
    registrosOriginales.filter(
      registro => {

        const nombreFas =
          normalizar(
            registro.nombre_fas
          );

        const activo =
          normalizar(
            registro.activo
          );


        const coincideActivo =
          !activoSeleccionado ||
          activo ===
            activoSeleccionado;


        const contieneBarco =
          nombreFas.includes(
            "BARCO"
          );


        const coincideTipo =
          !tipoSeleccionado ||
          (
            tipoSeleccionado ===
              "BARCOS" &&
            contieneBarco
          ) ||
          (
            tipoSeleccionado ===
              "MONTES" &&
            !contieneBarco
          );


        return (
          coincideActivo &&
          coincideTipo
        );
      }
    );


  const valores =
    [
      ...new Set(
        registrosLista
          .map(
            registro =>
              registro.nombre_fas
          )
          .filter(
            valor =>
              valor !== null &&
              valor !== undefined &&
              String(valor).trim() !== ""
          )
      )
    ];


  valores.sort(
    (a,b) =>
      String(a).localeCompare(
        String(b),
        "es",
        {
          sensitivity:"base"
        }
      )
  );


  select.innerHTML =
    "";


  const placeholder =
    document.createElement(
      "option"
    );

  placeholder.value =
    "";

  placeholder.textContent =
    "SELECCIONAR NOMBRE FAS";

  select.appendChild(
    placeholder
  );


  valores.forEach(
    valor => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(valor);

      option.textContent =
        String(valor);

      select.appendChild(
        option
      );
    }
  );


  if(
    valorAnterior &&
    valores.some(
      valor =>
        String(valor) ===
        valorAnterior
    )
  ){
    select.value =
      valorAnterior;
  }
  else{
    select.value =
      "";
  }

}



function actualizarVisibilidadColumnas(){

  document.body.classList.toggle(
    "modo-barcos",
    tipoSeleccionado ===
      "BARCOS"
  );

}



function actualizarVisibilidadAlertas(){

  const filtroActivo =
    document.getElementById(
      "filtroActivo"
    );

  const valorActivo =
    filtroActivo
      ? normalizar(
          filtroActivo.value
        )
      : "";


  const bloqueAlertas =
    document.getElementById(
      "bloqueAlertas"
    );


  if(!bloqueAlertas){
    return;
  }


  /* ACTIVO = NO -> ocultar ambos avisos */

  if(
    valorActivo === "NO"
  ){
    bloqueAlertas.style.display =
      "none";

    return;
  }


  bloqueAlertas.style.display =
    "";


  /* BARCOS -> ocultar solo aviso de rendimiento */

  const modoBarcos =
    document.body.classList.contains(
      "modo-barcos"
    );


  const botones =
    bloqueAlertas.querySelectorAll(
      "button"
    );


  botones.forEach(
    boton => {

      const texto =
        normalizar(
          boton.textContent
        );


      if(
        modoBarcos &&
        texto.includes(
          "NECESITA RENDIMIENTO"
        )
      ){
        boton.style.display =
          "none";
      }
      else{
        boton.style.display =
          "";
      }

    }
  );

}



function aplicarFiltros(){

  actualizarVisibilidadAlertas();

  actualizarVisibilidadColumnas();


  const nombreSeleccionado =
    normalizar(
      document.getElementById(
        "filtroNombreFas"
      ).value
    );


  const activoSeleccionado =
    normalizar(
      document.getElementById(
        "filtroActivo"
      ).value
    );


  const registros =
    registrosOriginales.filter(
      registro => {

        const nombreFas =
          normalizar(
            registro.nombre_fas
          );

        const especie =
          normalizar(
            registro.especie
          );


        const coincideNombre =
          !nombreSeleccionado ||
          nombreFas ===
            nombreSeleccionado;


        const coincideActivo =
          !activoSeleccionado ||
          normalizar(
            registro.activo
          ) ===
            activoSeleccionado;


        const esBarco =
          nombreFas.includes(
            "BARCO"
          );


        const coincideTipo =
          !tipoSeleccionado ||
          (
            tipoSeleccionado ===
              "BARCOS" &&
            esBarco
          ) ||
          (
            tipoSeleccionado ===
              "MONTES" &&
            !esBarco
          );


        const excluirSinEspecie =
          !especie ||
          especie === "-";


        const excluirTroza =
          especie.includes(
            "TROZA"
          );


        const excluirBalanza =
          nombreFas.includes(
            "BALANZA"
          );


        const excluirQuebrachoAlmedo =
          nombreFas ===
            "QUEBRACHO - ALMEDO SAS" &&
          especie ===
            "GLOBULUS 3,60";


        return (
          coincideNombre &&
          coincideActivo &&
          coincideTipo &&
          !excluirSinEspecie &&
          !excluirTroza &&
          !excluirBalanza &&
          !excluirQuebrachoAlmedo
        );

      }
    );


  registros.sort(
    (a,b) =>
      compararValores(
        obtenerValorOrden(
          a,
          campoOrden
        ),
        obtenerValorOrden(
          b,
          campoOrden
        ),
        campoOrden
      )
  );


  dibujarTabla(
    registros
  );

}



function obtenerValorOrden(registro, campo){

  if(
    campo ===
    "porcentaje_rendimiento"
  ){
    return calcularPorcentajeCobertura(
      registro.cantidad_pps,
      registro.total_remitos
    );
  }


  if(
    campo ===
    "porcentaje_densidad_basica"
  ){
    return calcularPorcentajeCobertura(
      registro.cantidad_densidad_basica,
      registro.total_remitos
    );
  }


  return registro[campo];
}



function compararValores(
  a,
  b,
  campo
){

  const multiplicador =
    direccionOrden ===
      "asc"
      ? 1
      : -1;


  if(
    a === null ||
    a === undefined ||
    a === ""
  ){
    return 1 *
      multiplicador;
  }


  if(
    b === null ||
    b === undefined ||
    b === ""
  ){
    return -1 *
      multiplicador;
  }


  const camposNumericos =
    [
      "cantidad_pps",
      "cantidad_densidad_basica",
      "promedio_rendimiento_con_merma",
      "promedio_pps",
      "promedio_densidad_basica",
      "total_remitos",
      "porcentaje_rendimiento",
      "porcentaje_densidad_basica",
      "ano"
    ];


  const camposFecha =
    [
      "ultima_fecha_pps",
      "ultima_fecha_densidad_basica",
      "ultima_fecha_remito"
    ];


  if(
    camposNumericos.includes(
      campo
    )
  ){

    const na =
      Number(a);

    const nb =
      Number(b);

    return (
      na - nb
    ) *
    multiplicador;
  }


  if(
    camposFecha.includes(
      campo
    )
  ){

    const fa =
      new Date(a).getTime();

    const fb =
      new Date(b).getTime();

    return (
      fa - fb
    ) *
    multiplicador;
  }


  return String(a).localeCompare(
    String(b),
    "es",
    {
      sensitivity:"base"
    }
  ) *
  multiplicador;

}

/* ============================================================
   EMERGENTES

   SOLO ACTIVO = SI
   SOLO AÑO ACTUAL

   REGLA:
   - únicamente registros cuyo campo ano coincide con el año actual
   - último ingreso < 30 días:
       mostrar si falta el análisis
   ============================================================ */

function obtenerPendientes(tipo){

  return registrosOriginales
    .filter(
      registro => {

        const nombreFas =
          normalizar(
            registro.nombre_fas
          );


        const especie =
          normalizar(
            registro.especie
          );


        const activoSi =
          normalizar(
            registro.activo
          ) ===
          "SI";


        if(!activoSi){
          return false;
        }


        /* ====================================================
           SOLO AÑO ACTUAL
           ==================================================== */

        const anoActual =
          new Date().getFullYear();


        const anoRegistro =
          Number(
            registro.ano
          );


        if(
          !Number.isFinite(
            anoRegistro
          ) ||
          anoRegistro !==
            anoActual
        ){
          return false;
        }


        const diasUltimoIngreso =
          diasDesdeFecha(
            registro.ultima_fecha_remito
          );


        if(
          diasUltimoIngreso ===
          null
        ){
          return false;
        }


        const ingresoMenor30Dias =
          diasUltimoIngreso >= 0 &&
          diasUltimoIngreso < 30;


        if(
          !ingresoMenor30Dias
        ){
          return false;
        }


        const cantidadRendimiento =
          Number(
            registro.cantidad_pps ||
            0
          );


        const cantidadDensidad =
          Number(
            registro.cantidad_densidad_basica ||
            0
          );


        const sinRendimiento =
          cantidadRendimiento ===
          0;


        const sinDensidad =
          cantidadDensidad ===
          0;


        const excluirSinEspecie =
          !especie ||
          especie === "-";


        const excluirTroza =
          especie.includes(
            "TROZA"
          );


        const excluirBalanza =
          nombreFas.includes(
            "BALANZA"
          );


        const excluirQuebrachoAlmedo =
          nombreFas ===
            "QUEBRACHO - ALMEDO SAS" &&
          especie ===
            "GLOBULUS 3,60";


        if(
          excluirSinEspecie ||
          excluirTroza ||
          excluirBalanza ||
          excluirQuebrachoAlmedo
        ){
          return false;
        }


        if(
          tipo ===
          "RENDIMIENTO"
        ){

          if(
            ingresoMenor30Dias &&
            sinRendimiento
          ){
            return true;
          }


          return false;
        }


        if(
          tipo ===
          "DENSIDAD"
        ){

          if(
            ingresoMenor30Dias &&
            sinDensidad
          ){
            return true;
          }


          return false;
        }


        return false;

      }
    )
    .sort(
      (a,b) => {

        const monteA =
          normalizar(
            a.nombre_fas
          );


        const monteB =
          normalizar(
            b.nombre_fas
          );


        if(
          monteA !==
          monteB
        ){

          return monteA.localeCompare(
            monteB,
            "es"
          );

        }


        const productoA =
          normalizar(
            a.especie
          );


        const productoB =
          normalizar(
            b.especie
          );


        const comparacionProducto =
          productoA.localeCompare(
            productoB,
            "es"
          );


        if(
          comparacionProducto !== 0
        ){
          return comparacionProducto;
        }


        return (
          Number(
            b.ano || 0
          ) -
          Number(
            a.ano || 0
          )
        );

      }
    );

}

async function cargarDatos(){

  try{

    const separador =
      URL_JSON.includes("?")
        ? "&"
        : "?";


    const url =
      URL_JSON +
      separador +
      "t=" +
      Date.now();


    const respuesta =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(
      !respuesta.ok
    ){

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }


    const datos =
      await respuesta.json();


    registrosOriginales =
      Array.isArray(
        datos.registros
      )
        ?
        datos.registros
        :
        [];


    document.getElementById(
      "actualizado"
    ).textContent =
      "Actualizado: " +
      formatearFechaHora(
        datos.actualizado
      );


    cargarFiltroNombreFas();

    aplicarFiltros();

    actualizarEstadoBotonesNecesidad();

  }
  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "actualizado"
    ).textContent =
      "No fue posible cargar los datos";


    document.getElementById(
      "tablaBody"
    ).innerHTML =
      `
      <tr>

        <td
          colspan="15"
          class="mensaje error"
        >
          No fue posible cargar los datos:
          ${valorSeguro(
            error.message
          )}
        </td>

      </tr>
      `;

  }

}
