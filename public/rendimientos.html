<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    RENDIMIENTOS Y DENSIDAD BASICA
  </title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0b0d11;
      color:#f4f4f4;
      font-family:Segoe UI, Arial, sans-serif;
    }

    .contenedor{
      width:min(1800px,98%);
      margin:20px auto;
    }

    .titulo{
      text-align:center;
      font-size:28px;
      font-weight:800;
      color:#d7ff5f;
      margin-bottom:5px;
    }

    .actualizado{
      text-align:center;
      color:#aeb5bf;
      margin-bottom:22px;
    }

    .filtros{
      background:#15181e;
      border:1px solid #2c313b;
      border-radius:10px;
      padding:18px;
      margin-bottom:18px;
    }

    .fila-controles{
      display:grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);
      gap:20px;
      width:100%;
      margin-bottom:14px;
    }

    .fila-controles:last-child{
      margin-bottom:0;
    }

    .tipo-label{
      grid-column:1 / -1;
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:#aeb5bf;
    }

    .filtro{
      width:100%;
      min-width:0;
    }

    .filtro label{
      display:block;
      text-align:center;
      font-size:12px;
      font-weight:700;
      color:#aeb5bf;
      margin-bottom:8px;
    }

    select,
    .tipo-btn,
    .necesidad-btn{
      width:100%;
      height:39px;
      border-radius:6px;
      border:1px solid #353b46;
      font-size:13px;
      font-weight:700;
    }

    select{
      background:#0f1115;
      color:#fff;
      padding:0 12px;
    }

    .tipo-btn{
      background:#101319;
      color:#d7ff5f;
      cursor:pointer;
    }

    .tipo-btn.activo{
      background:#d7ff5f;
      color:#0b0d11;
      border-color:#d7ff5f;
    }

    .necesidad-btn{
      cursor:pointer;
    }

    .necesidad-btn.con-registros{
      background:#ff4d4f;
      color:#fff;
      border-color:#ff4d4f;
    }

    .necesidad-btn.sin-registros{
      background:#d7ff5f;
      color:#0b0d11;
      border-color:#d7ff5f;
    }

    .tabla-contenedor{
      overflow:auto;
      border:1px solid #2c313b;
      border-radius:10px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#111419;
      min-width:1050px;
    }

    th,
    td{
      padding:10px 9px;
      border-bottom:1px solid #292e36;
      text-align:center;
      white-space:nowrap;
    }

    th{
      position:sticky;
      top:0;
      background:#1a1e25;
      color:#d7ff5f;
      font-size:12px;
      z-index:2;
    }

    th.sortable{
      cursor:pointer;
    }

    th.sortable::after{
      content:" ↕";
      color:#6f7680;
    }

    th.sortable.asc::after{
      content:" ▲";
      color:#d7ff5f;
    }

    th.sortable.desc::after{
      content:" ▼";
      color:#d7ff5f;
    }

    td{
      font-size:12px;
    }

    .nombre-fas-click{
      cursor:pointer;
      font-weight:700;
    }

    .nombre-fas-click:hover{
      color:#d7ff5f;
      text-decoration:underline;
    }

    .activo-si{
      color:#d7ff5f;
      font-weight:700;
    }

    .activo-no{
      color:#ff7171;
      font-weight:700;
    }

    .sin-dato{
      color:#7d848d;
    }

    .mensaje{
      padding:28px;
      text-align:center;
      color:#aeb5bf;
    }

    .error{
      color:#ff7171;
    }


    /* ============================================================
       BARCOS
       La tabla compacta usa las mismas columnas.
       ============================================================ */

    /* ============================================================
       MODAL
       ============================================================ */

    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:20px;
    }

    .modal-overlay.visible{
      display:flex;
    }

    .modal-contenido{
      width:min(760px,96vw);
      max-height:85vh;
      background:#171a21;
      border:1px solid #343a46;
      border-radius:12px;
      overflow:hidden;
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 18px;
      border-bottom:1px solid #292e38;
      background:#20242c;
    }

    .modal-titulo{
      margin:0;
      font-size:18px;
      color:#d7ff5f;
    }

    .modal-cerrar{
      border:0;
      background:transparent;
      color:#fff;
      font-size:26px;
      cursor:pointer;
    }

    .modal-body{
      padding:16px;
      overflow:auto;
      max-height:calc(85vh - 65px);
    }

    .modal-tabla{
      width:100%;
      min-width:0;
    }

    .modal-vacio{
      padding:28px 10px;
      text-align:center;
      color:#a7adb7;
    }


    @media(max-width:800px){

      .fila-controles{
        gap:10px;
      }

      .titulo{
        font-size:22px;
      }

    }


    /* ============================================================
       TABLA COMPACTA / COBERTURA
       ============================================================ */

    .tabla-principal{
      min-width:980px;
    }

    .barra-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:145px;
    }

    .barra-track{
      position:relative;
      flex:1;
      height:9px;
      background:#252a32;
      border-radius:999px;
      overflow:hidden;
      border:1px solid #323843;
    }

    .barra-fill{
      height:100%;
      border-radius:999px;
    }

    .barra-fill.bajo{
      background:#ff4d4f;
    }

    .barra-fill.medio{
      background:#e6c34f;
    }

    .barra-fill.alto{
      background:#d7ff5f;
    }

    .barra-texto{
      min-width:48px;
      text-align:right;
      font-weight:700;
    }

    .btn-detalle{
      border:1px solid #353b46;
      background:#101319;
      color:#d7ff5f;
      border-radius:6px;
      padding:7px 12px;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-detalle:hover{
      background:#1a1f27;
      border-color:#d7ff5f;
    }

    .fila-detalle{
      display:none;
      background:#0d1015;
    }

    .fila-detalle.visible{
      display:table-row;
    }

    .fila-detalle td{
      padding:0;
      white-space:normal;
      text-align:left;
    }

    .detalle-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(180px,1fr));
      gap:10px;
      padding:14px 16px 16px;
      border-top:1px solid #292e36;
    }

    .detalle-item{
      background:#15181e;
      border:1px solid #2c313b;
      border-radius:8px;
      padding:10px 12px;
    }

    .detalle-label{
      color:#8f97a2;
      font-size:10px;
      font-weight:700;
      text-transform:uppercase;
      margin-bottom:5px;
    }

    .detalle-valor{
      color:#f4f4f4;
      font-size:13px;
      font-weight:700;
    }

    .detalle-valor.lima{
      color:#d7ff5f;
    }

    @media(max-width:900px){
      .detalle-grid{
        grid-template-columns:repeat(2,minmax(160px,1fr));
      }
    }

    @media(max-width:560px){
      .detalle-grid{
        grid-template-columns:1fr;
      }
    }


    /* ============================================================
       GUIA DE TIEMPO
       ============================================================ */

    .tiempo-panel{
      background:#15181e;
      border:1px solid #2c313b;
      border-radius:10px;
      padding:16px 18px 18px;
      margin-bottom:18px;
    }

    .tiempo-titulo{
      text-align:center;
      color:#d7ff5f;
      font-size:12px;
      font-weight:800;
      letter-spacing:.5px;
      margin-bottom:14px;
    }

    .tiempo-slider{
      width:100%;
      accent-color:#d7ff5f;
      cursor:pointer;
    }

    .tiempo-marcas{
      display:grid;
      grid-template-columns:repeat(8,1fr);
      gap:4px;
      margin-top:8px;
      color:#8f97a2;
      font-size:10px;
      font-weight:700;
      text-align:center;
    }

    .tiempo-marcas span.activa{
      color:#d7ff5f;
    }

    .tiempo-info{
      margin-top:12px;
      text-align:center;
      color:#aeb5bf;
      font-size:12px;
    }

    .tiempo-info strong{
      color:#f4f4f4;
    }

    @media(max-width:700px){

      .tiempo-marcas{
        font-size:8px;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="titulo">
    RENDIMIENTOS Y DENSIDAD BASICA
  </div>


  <div
    class="actualizado"
    id="actualizado"
  >
    Cargando datos...
  </div>


  <div class="filtros">


    <div class="fila-controles">

      <div class="tipo-label">
        TIPO
      </div>


      <button
        type="button"
        class="tipo-btn"
        id="btnMontes"
      >
        MONTES
      </button>


      <button
        type="button"
        class="tipo-btn"
        id="btnBarcos"
      >
        BARCOS
      </button>

    </div>


    <div class="fila-controles">


      <div class="filtro">

        <label for="filtroNombreFas">
          NOMBRE FAS
        </label>

        <select id="filtroNombreFas">
        </select>

      </div>


      <div class="filtro">

        <label for="filtroActivo">

        </label>

        <select id="filtroActivo">

          <option value="">

<div class="tabla-contenedor">

          <th class="sortable" data-campo="nombre_fas">

      <tbody id="tablaBody">

          <td colspan="7" class="mensaje">

          </td>
        </tr>

    </table>

  </div>


</div>



<div
  class="modal-overlay"
  id="modalNecesidad"
>

  <div class="modal-contenido">


    <div class="modal-header">


      <h2
        class="modal-titulo"
        id="modalTitulo"

        Aviso
      </h2>


      <button

        id="modalCerrar"

        &times;
      </button>


    </div>


    <div

    </div>


  </div>

</div>



<script>


const URL_JSON =
  "/api/rendimientos";


let registrosOriginales = [];

let tipoSeleccionado = "";

let campoOrden =
  "nombre_fas";

let direccionOrden =
  "asc";


let filtroTiempoSeleccionado =
  0;


const opcionesTiempo = [
  {
    etiqueta:"TODOS",
    dias:null
  },
  {
    etiqueta:"5 AÑOS",
    dias:365 * 5
  },
  {
    etiqueta:"2 AÑOS",
    dias:365 * 2
  },
  {
    etiqueta:"1 AÑO",
    dias:365
  },
  {
    etiqueta:"6 MESES",
    dias:183
  },
  {
    etiqueta:"3 MESES",
    dias:92
  },
  {
    etiqueta:"30 DÍAS",
    dias:30
  },
  {
    etiqueta:"HOY",
    dias:0
  }
];



function normalizar(valor){

  if(
    valor === null ||
    valor === undefined
  ){
    return "";
  }

  return String(valor)
    .trim()
    .toUpperCase();
}



function formatearFecha(valor){

  if(!valor){
    return "-";
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return valor;
  }

  return fecha.toLocaleDateString(
    "es-UY",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );
}



function formatearFechaHora(valor){

  if(!valor){
    return "-";
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return valor;
  }

  return fecha.toLocaleString(
    "es-UY",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );
}



function valorSeguro(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  return String(valor);
}



function contadorSeguro(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero) ||
    numero === 0
  ){
    return '<span class="sin-dato">-</span>';
  }

  return numero.toLocaleString(
    "es-UY"
  );
}



function numeroDecimal(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero)
  ){
    return valorSeguro(valor);
  }

  return numero.toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:3,
      maximumFractionDigits:3
    }
  );
}



function porcentajePPS(valor){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){
    return '<span class="sin-dato">-</span>';
  }

  const numero =
    Number(valor);

  if(
    isNaN(numero)
  ){
    return valorSeguro(valor);
  }

  return (
    numero * 100
  ).toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:1,
      maximumFractionDigits:1
    }
  ) + "%";
}



function claseCobertura(porcentaje){

  if(
    porcentaje === null ||
    porcentaje === undefined ||
    !Number.isFinite(
      Number(porcentaje)
    )
  ){
    return "";
  }

  const valor =
    Number(porcentaje);

  if(valor < 10){
    return "bajo";
  }

  if(valor < 25){
    return "medio";
  }

  return "alto";
}



function barraCobertura(cantidad, total){

  const porcentaje =
    calcularPorcentajeCobertura(
      cantidad,
      total
    );

  if(
    porcentaje === null
  ){
    return '<span class="sin-dato">-</span>';
  }

  const valorBarra =
    Math.max(
      0,
      Math.min(
        100,
        porcentaje
      )
    );

  const clase =
    claseCobertura(
      porcentaje
    );

  const texto =
    porcentaje.toLocaleString(
      "es-UY",
      {
        minimumFractionDigits:1,
        maximumFractionDigits:1
      }
    ) + "%";

  return `
    <div class="barra-wrap">
      <div class="barra-track">
        <div
          class="barra-fill ${clase}"
          style="width:${valorBarra}%"
        ></div>
      </div>
      <div class="barra-texto">
        ${texto}
      </div>
    </div>
  `;
}



function porcentajeCobertura(cantidad, total){

  const cantidadNumero =
    Number(cantidad);

  const totalNumero =
    Number(total);


  if(
    !Number.isFinite(cantidadNumero) ||
    !Number.isFinite(totalNumero) ||
    totalNumero <= 0
  ){
    return '<span class="sin-dato">-</span>';
  }


  const porcentaje =
    (
      cantidadNumero /
      totalNumero
    ) *
    100;


  return porcentaje.toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:1,
      maximumFractionDigits:1
    }
  ) + "%";
}



function calcularPorcentajeCobertura(cantidad, total){

  const cantidadNumero =
    Number(cantidad);

  const totalNumero =
    Number(total);


  if(
    !Number.isFinite(cantidadNumero) ||
    !Number.isFinite(totalNumero) ||
    totalNumero <= 0
  ){
    return null;
  }


  return (
    cantidadNumero /
    totalNumero
  ) *
  100;
}



function diasDesdeFecha(valor){

  if(!valor){
    return null;
  }

  const fecha =
    new Date(valor);

  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return null;
  }

  return (
    Date.now() -
    fecha.getTime()
  ) /
  (
    1000 *
    60 *
    60 *
    24
  );
}



function fechaSolo(valor){

  if(!valor){
    return null;
  }

  const texto =
    String(valor).trim();


  const iso =
    texto.match(
      /^(\d{4})-(\d{2})-(\d{2})/
    );


  if(iso){

    const fecha =
      new Date(
        Number(iso[1]),
        Number(iso[2]) - 1,
        Number(iso[3])
      );

    fecha.setHours(
      0,
      0,
      0,
      0
    );

    return fecha;
  }


  const fecha =
    new Date(valor);


  if(
    isNaN(
      fecha.getTime()
    )
  ){
    return null;
  }


  fecha.setHours(
    0,
    0,
    0,
    0
  );

  return fecha;
}



function cumpleFiltroTiempo(registro){

  const opcion =
    opcionesTiempo[
      filtroTiempoSeleccionado
    ];


  if(
    !opcion ||
    opcion.dias === null
  ){
    return true;
  }


  const fechaIngreso =
    fechaSolo(
      registro.ultima_fecha_remito
    );


  if(!fechaIngreso){
    return false;
  }


  const hoy =
    new Date();


  hoy.setHours(
    0,
    0,
    0,
    0
  );


  if(
    opcion.dias === 0
  ){
    return (
      fechaIngreso.getTime() ===
      hoy.getTime()
    );
  }


  const fechaLimite =
    new Date(hoy);


  fechaLimite.setDate(
    fechaLimite.getDate() -
    opcion.dias
  );


  return (
    fechaIngreso >=
    fechaLimite
  );
}



function actualizarGuiaTiempo(){

  const opcion =
    opcionesTiempo[
      filtroTiempoSeleccionado
    ];


  document
    .querySelectorAll(
      "#tiempoMarcas [data-tiempo]"
    )
    .forEach(
      marca => {

        marca.classList.toggle(
          "activa",
          Number(
            marca.dataset.tiempo
          ) ===
          filtroTiempoSeleccionado
        );

      }
    );


  let texto =
    "TODOS LOS REGISTROS";


  if(
    opcion &&
    opcion.dias !== null
  ){

    if(
      opcion.dias === 0
    ){
      texto =
        "SOLO INGRESOS DE HOY";
    }
    else{

      const hoy =
        new Date();


      hoy.setHours(
        0,
        0,
        0,
        0
      );


      const fechaLimite =

          }
        );
    }

  }


  document.getElementById(

}



function cargarFiltroNombreFas(){

  const select =
    document.getElementById(
      "filtroNombreFas"
    );

  const activoSeleccionado =
    normalizar(
      document.getElementById(
        "filtroActivo"
      ).value
    );

  const valorAnterior =
    select.value;


  const registrosLista =
    registrosOriginales.filter(
      registro => {

        const nombreFas =
          normalizar(
            registro.nombre_fas
          );

        const activo =
          normalizar(
            registro.activo
          );


        const coincideActivo =
          !activoSeleccionado ||
          activo ===
            activoSeleccionado;


        const contieneBarco =
          nombreFas.includes(
            "BARCO"
          );


        const coincideTipo =
          !tipoSeleccionado ||
          (
            tipoSeleccionado ===
              "BARCOS" &&
            contieneBarco
          ) ||
          (
            tipoSeleccionado ===
              "MONTES" &&
            !contieneBarco
          );


        return (
          coincideActivo &&
          coincideTipo
        );
      }
    );


  const valores =
    [
      ...new Set(
        registrosLista
          .map(
            registro =>
              registro.nombre_fas
          )
          .filter(
            valor =>
              valor !== null &&
              valor !== undefined &&
              String(valor).trim() !== ""
          )
      )
    ];


  valores.sort(
    (a,b) =>
      String(a).localeCompare(
        String(b),
        "es",
        {
          sensitivity:"base"
        }
      )
  );


  select.innerHTML =
    "";


  const placeholder =
    document.createElement(
      "option"
    );

  placeholder.value =
    "";

  placeholder.textContent =
    "SELECCIONAR NOMBRE FAS";

  select.appendChild(
    placeholder
  );


  valores.forEach(
    valor => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(valor);

      option.textContent =
        String(valor);

      select.appendChild(
        option
      );
    }
  );


  if(
    valorAnterior &&
    valores.some(
      valor =>
        String(valor) ===
        valorAnterior
    )
  ){
    select.value =
      valorAnterior;
  }
  else{
    select.value =
      "";
  }

}

          );

          ) ||
          (

              "MONTES" &&
            !esBarco
          );

        const excluirTroza =
          especie.includes(
            "TROZA"

        const excluirQuebrachoAlmedo =

        const coincideTiempo =

          );


        return (

        );

function obtenerValorOrden(registro, campo){

  if(
    campo ===
    "porcentaje_rendimiento"
  ){
    return calcularPorcentajeCobertura(
      registro.cantidad_pps,
      registro.total_remitos
    );
  }


  if(
    campo ===
    "porcentaje_densidad_basica"
  ){
    return calcularPorcentajeCobertura(
      registro.cantidad_densidad_basica,
      registro.total_remitos
    );
  }


  return registro[campo];
}



function compararValores(
  a,
  b,
  campo
){

  const multiplicador =
    direccionOrden ===
      "asc"
      ? 1
      : -1;


  if(
    a === null ||
    a === undefined ||
    a === ""
  ){
    return 1 *
      multiplicador;
  }


  if(
    b === null ||
    b === undefined ||
    b === ""
  ){
    return -1 *
      multiplicador;
  }


  const camposNumericos =
    [
      "cantidad_pps",
      "cantidad_densidad_basica",
      "promedio_rendimiento_con_merma",
      "promedio_pps",
      "promedio_densidad_basica",
      "total_remitos",
      "porcentaje_rendimiento",
      "porcentaje_densidad_basica"
    ];


  const camposFecha =
    [
      "ultima_fecha_pps",
      "ultima_fecha_densidad_basica",
      "ultima_fecha_remito"
    ];


  if(
    camposNumericos.includes(
      campo
    )
  ){

    const na =
      Number(a);

    const nb =
      Number(b);

    return (
      na - nb
    ) *
    multiplicador;
  }


  if(
    camposFecha.includes(
      campo
    )
  ){

    const fa =
      new Date(a).getTime();

    const fb =
      new Date(b).getTime();

    return (
      fa - fb
    ) *
    multiplicador;
  }


  return String(a).localeCompare(
    String(b),
    "es",
    {
      sensitivity:"base"
    }
  ) *
  multiplicador;

}

/* ============================================================
   EMERGENTES

   SOLO ACTIVO = SI

   REGLA:
   - último ingreso < 30 días:
       mostrar si falta el análisis
   - último ingreso > 365 días:
       mostrar siempre, aunque tenga históricos
   ============================================================ */

function obtenerPendientes(tipo){

  return registrosOriginales
    .filter(
      registro => {

        const nombreFas =
          normalizar(
            registro.nombre_fas
          );


        const especie =
          normalizar(
            registro.especie
          );


        const activoSi =
          normalizar(
            registro.activo
          ) ===
          "SI";


        if(!activoSi){
          return false;
        }


        const diasUltimoIngreso =
          diasDesdeFecha(
            registro.ultima_fecha_remito
          );


        if(
          diasUltimoIngreso ===
          null
        ){
          return false;
        }


        const ingresoMenor30Dias =
          diasUltimoIngreso >= 0 &&
          diasUltimoIngreso < 30;


        const ingresoMayor1Ano =
          diasUltimoIngreso > 365;


        if(
          !ingresoMenor30Dias &&
          !ingresoMayor1Ano
        ){
          return false;
        }


        const cantidadRendimiento =
          Number(
            registro.cantidad_pps ||
            0
          );


        const cantidadDensidad =
          Number(
            registro.cantidad_densidad_basica ||
            0
          );


        const sinRendimiento =
          cantidadRendimiento ===
          0;


        const sinDensidad =
          cantidadDensidad ===
          0;


        const excluirSinEspecie =
          !especie ||
          especie === "-";


        const excluirTroza =
          especie.includes(
            "TROZA"
          );


        const excluirBalanza =
          nombreFas.includes(
            "BALANZA"
          );


        const excluirQuebrachoAlmedo =
          nombreFas ===
            "QUEBRACHO - ALMEDO SAS" &&
          especie ===
            "GLOBULUS 3,60";


        if(
          excluirSinEspecie ||
          excluirTroza ||
          excluirBalanza ||
          excluirQuebrachoAlmedo
        ){
          return false;
        }


        if(
          tipo ===
          "RENDIMIENTO"
        ){

          if(
            ingresoMayor1Ano
          ){
            return true;
          }


          if(
            ingresoMenor30Dias &&
            sinRendimiento
          ){
            return true;
          }


          return false;
        }


        if(
          tipo ===
          "DENSIDAD"
        ){

          if(
            ingresoMayor1Ano
          ){
            return true;
          }


          if(
            ingresoMenor30Dias &&
            sinDensidad
          ){
            return true;
          }


          return false;
        }


        return false;

      }
    )
    .sort(
      (a,b) => {

        const monteA =
          normalizar(
            a.nombre_fas
          );


        const monteB =
          normalizar(
            b.nombre_fas
          );


        if(
          monteA !==
          monteB
        ){

          return monteA.localeCompare(
            monteB,
            "es"
          );

        }


        const productoA =
          normalizar(
            a.especie
          );


        const productoB =
          normalizar(
            b.especie
          );


        return productoA.localeCompare(
          productoB,
          "es"
        );

      }
    );

}

async function cargarDatos(){

  try{

    const separador =
      URL_JSON.includes("?")
        ? "&"
        : "?";


    const url =
      URL_JSON +
      separador +
      "t=" +
      Date.now();


    const respuesta =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(
      !respuesta.ok
    ){

      throw new Error(
        "HTTP " +
        respuesta.status
      );

    }


    const datos =
      await respuesta.json();


    registrosOriginales =
      Array.isArray(
        datos.registros
      )
        ?
        datos.registros
        :
        [];


    document.getElementById(
      "actualizado"
    ).textContent =
      "Actualizado: " +
      formatearFechaHora(
        datos.actualizado
      );


    cargarFiltroNombreFas();

    aplicarFiltros();

    actualizarEstadoBotonesNecesidad();

  }
  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "actualizado"
    ).textContent =
      "No fue posible cargar los datos";


    document.getElementById(
      "tablaBody"
    ).innerHTML =
      `
      <tr>

        <td
          colspan="14"
          class="mensaje error"
        >
          No fue posible cargar los datos:
          ${valorSeguro(
            error.message
          )}
        </td>

      </tr>
      `;

  }

}

          nuevoCampo
        ){

          direccionOrden =
            direccionOrden ===
              "asc"
              ?
              "desc"
              :
              "asc";

        }
        else{

          campoOrden =
            nuevoCampo;

          direccionOrden =
            "asc";

        }


        actualizarIndicadoresOrden();

        aplicarFiltros();

      }
    );

  }
);



function actualizarIndicadoresOrden(){

  document.querySelectorAll(
    "th.sortable"
  ).forEach(
    th => {

      th.classList.remove(
        "asc",
        "desc"
      );


      if(
        th.dataset.campo ===
        campoOrden
      ){

        th.classList.add(
          direccionOrden
        );

      }

    }
  );

}



actualizarIndicadoresOrden();

actualizarGuiaTiempo();

cargarDatos();


</script>
